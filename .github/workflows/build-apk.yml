name: Build CES English Coach APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct project source
        shell: bash
        run: |
          cat payload/part00.txt payload/part01.txt payload/part02.txt payload/part03.txt payload/part04.txt > source.b64
          base64 --decode source.b64 > source.zip
          unzip -q source.zip
          test -f CES-English-Coach-v6/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: CES-English-Coach-v6
        run: gradle --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp CES-English-Coach-v6/app/build/outputs/apk/debug/app-debug.apk output/CES-English-Coach.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CES-English-Coach
          path: output/CES-English-Coach.apk
          if-no-files-found: error
