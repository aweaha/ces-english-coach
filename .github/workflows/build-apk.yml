name: Build CES English Coach APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Android SDK
        run: |
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Accept Android SDK licenses
        run: yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Install Android SDK 35
        run: "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q source/CES-English-Coach-v6.zip -d build-src
          test -f build-src/CES-English-Coach-v6/settings.gradle

      - name: Build debug APK
        working-directory: build-src/CES-English-Coach-v6
        run: gradle --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p output
          cp build-src/CES-English-Coach-v6/app/build/outputs/apk/debug/app-debug.apk output/CES-English-Coach.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CES-English-Coach
          path: output/CES-English-Coach.apk
          if-no-files-found: error
