name: Build ParkTube APK
on:
  push:
    branches: [ parktube-aa-browser ]
    paths:
      - 'ParkTubeAABrowser/**'
      - '.github/workflows/parktube-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p ParkTubeAABrowser assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ParkTube-PWK-2.1.0
          path: ParkTubeAABrowser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
